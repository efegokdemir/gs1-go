version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gocyclo
    - gosec
    - misspell
    - prealloc
    - revive
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers"]
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
